<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Support Widget sample workspace</title>
<link rel="stylesheet" href="/starter/sample.css">
<script defer src="/widget.v0.3.0.js"></script>
<script defer src="/starter/sample.js"></script>
<main>
  <div class="buttons"><button type="button" id="open" data-copy="sampleOpen" disabled>Open support chat</button><button type="button" id="reset" data-copy="sampleReset" disabled>Reset sample</button></div>
  <p class="eyebrow" data-copy="sampleWorkspace">Sample workspace</p>
  <h1 data-copy="sampleTitle">Customer imports</h1>
  <p data-copy="sampleIntro">Try support for a fictional customer import. The reply comes from sample data.</p>
  <section aria-label="Import activity">
    <span>customers.csv <small>import_1042</small></span>
    <strong data-copy="sampleFailed">Failed</strong>
  </section>
  <p><span data-copy="sampleQuestionLabel">Suggested message</span> <b data-copy="sampleQuestion">Why did my import fail?</b></p>
  <p role="status" id="status"></p>
</main>
</html>
