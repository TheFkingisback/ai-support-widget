services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiwidget
      POSTGRES_USER: aiwidget
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aiwidget-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwidget"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    networks:
      - aiwidget-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    labels:
      ai-support-autoheal: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aiwidget:${DB_PASSWORD}@postgres:5432/aiwidget
      REDIS_URL: redis://redis:6379
      # Retained only to decrypt preexisting data; never accepts legacy signatures.
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set a distinct ADMIN_JWT_SECRET}
      WIDGET_JWT_SECRET: ${WIDGET_JWT_SECRET:?Set a distinct WIDGET_JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.prod}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env.prod}
      LOG_LEVEL: ${LOG_LEVEL:-low}
      PORT: 3005
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
      WORKSPACE_PUBLIC_ORIGIN: https://${DOMAIN}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      POSTMARK_FROM: ${POSTMARK_FROM:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DAILY_COST_ALERT_USD: ${DAILY_COST_ALERT_USD:-25}
      TURN_QUEUE_MODE: ${TURN_QUEUE_MODE:-inline}
      TURN_WORKER_CONCURRENCY: ${TURN_WORKER_CONCURRENCY:-8}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set a private encryption key}
    ports:
      - "127.0.0.1:3005:3005"
    stop_grace_period: 2m
    networks:
      - aiwidget-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
    restart: unless-stopped
    labels:
      ai-support-autoheal: "true"
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:3006:3000"
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: https://${DOMAIN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - aiwidget-net

networks:
  aiwidget-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
